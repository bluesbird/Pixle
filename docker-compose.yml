services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      POSTGRES_DB: ${PIXLE_POSTGRES_DB}
      POSTGRES_USER: ${PIXLE_POSTGRES_USER}
      POSTGRES_PASSWORD: ${PIXLE_POSTGRES_PASSWORD}
    volumes:
      - pixle-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      DATABASE_URL: ${PIXLE_DATABASE_URL}
      COOKIE_SECURE: "true"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "18000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import json,urllib.request;print(json.loads(urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3).read().decode())['status'])"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "18080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/ >/dev/null 2>&1"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 10s

volumes:
  pixle-postgres-data:
